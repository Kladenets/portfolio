# workflow to deploy to Github Pages when changes are pushed to the main branch
name: Deploy Next.js site to Pages (pre-production)

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']
    paths:
      - '**/src/**'
      - '**/public/**'
      - '**/package*.json'
      - '**/next.config.ts'
      - '**/tailwind.config.js'
      - '**/tsconfig.json'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  schedule:
    - cron: '17 3 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check-resume:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check resume Gist hash
        id: compare
        env:
          RESUME_GIST_URL: https://gist.githubusercontent.com/Kladenets/58e9ff9ad9dc8fc33a48961b4e18b4d9/raw/resume.json
        run: |
          set -euo pipefail
          current_hash=$(curl --fail --silent --show-error --location "$RESUME_GIST_URL" | sha256sum | cut -d ' ' -f 1)
          previous_hash=$(cat .github/gist-state/resume.sha256 2>/dev/null || true)

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$current_hash" = "$previous_hash" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Resume Gist unchanged ($current_hash); skipping deployment."
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "$current_hash" > /tmp/resume.sha256
            echo "Resume Gist changed or deployment was explicitly requested ($current_hash)."
          fi
      - name: Upload resume hash
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resume-hash
          path: /tmp/resume.sha256

  # Build job
  build:
    needs: check-resume
    if: needs.check-resume.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build site and resume PDF
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  record-resume-hash:
    runs-on: ubuntu-latest
    needs: [check-resume, deploy]
    if: needs.check-resume.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download resume hash
        uses: actions/download-artifact@v4
        with:
          name: resume-hash
          path: /tmp
      - name: Record deployed resume hash
        run: |
          set -euo pipefail
          cp /tmp/resume.sha256 .github/gist-state/resume.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gist-state/resume.sha256
          git diff --cached --quiet || git commit -m 'chore: record deployed resume hash'
          git push
